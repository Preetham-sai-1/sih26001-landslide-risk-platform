# SIH26001 — local development orchestration (SCAFFOLD, NOT YET FUNCTIONAL)
#
# Status: structural placeholder only. Each service's Dockerfile does not
# exist yet (see docker/ and per-service directories), so `docker compose up`
# will not work until those are implemented in a later phase. This file
# exists now so the intended topology is documented and reviewable before
# any service code is written.
#
# No credentials, ports, or hostnames below are final — all secrets are
# sourced from a local .env file (git-ignored; see .env.example once added)
# and never hard-coded here.

version: "3.9"

services:
  # PostgreSQL + PostGIS: shared spatial data store.
  # Official image name below is a real, existing image; version pinning
  # and actual schema/init scripts are a later task.
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No init SQL wired up yet — schema does not exist until the backend's
    # JPA entities / migration scripts are implemented.

  # FastAPI ML service — NOT YET IMPLEMENTED.
