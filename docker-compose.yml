version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sih26001-postgis
    environment:
      POSTGRES_DB: sih26001_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih26001_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sih26001-fastapi
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  spring:
    build:
      context: ./backend/springboot
      dockerfile: Dockerfile
    container_name: sih26001-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sih26001_dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FASTAPI_BASE_URL: http://fastapi:8000
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
    container_name: sih26001-frontend
    ports:
      - "3000:80"
    depends_on:
      - spring

volumes:
  sih_pgdata:
