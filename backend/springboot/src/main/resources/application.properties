# Enterprise Spring Boot Backend Configuration
server.port=8080

# Primary PostgreSQL Runtime Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sih26001_dev}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Deterministic Schema Initialization (No Destructive auto-ddl create/drop)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# FastAPI Engine Configuration (Strict 3s Connect / Read Timeouts)
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000/api/v1}
fastapi.connect-timeout=3000
fastapi.read-timeout=3000
