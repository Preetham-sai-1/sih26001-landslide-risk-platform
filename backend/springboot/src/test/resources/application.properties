# Test Profile Database Configuration (H2 In-Memory Only)
spring.datasource.url=jdbc:h2:mem:landslidedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Deterministic Test Schema Initialization
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

fastapi.base-url=http://localhost:8000/api/v1
fastapi.connect-timeout=1000
fastapi.read-timeout=1000
