    duplicate_coordinates: "739 of 8,546 NER records (8.6%) share exact coordinates with another record."
    duplicate_slide_no: "22 of 8,546 NER records share a SLIDE_NO with another record (checked via existing leakage_audit.check_duplicate_event_leakage)."
    missing_triggering_field: "609 of 8,546 (7.1%) missing TRIGGERING."
    represents_observed_events: >
      YES, not a susceptibility/hazard map -- confirmed by schema: each
      record has SLIDE_NO, LS_AREA, LS_VOLUME, ACTIVITY (Active/Suspended/
      Dormant/Reactivated), STYLE (Single/Multiple/Successive/Complex),
      TRIGGERING, INITIATION year, and impact fields (PERSONS_DE,
      PEOPLE_AFF) -- i.e. individually mapped, characterized landslide
      events, not a zonation grid.
    suitability_as_positive_ml_labels: >
      Usable as positive labels with caveats: (1) date coverage is very
      poor (79.4% missing year) -- temporal alignment per
      docs/temporal_alignment.md will be far harder than for the
      single-event Kerala inventory; (2) duplicate coordinates (8.6%)
      and duplicate SLIDE_NO (22 records) need resolution before use,
      matching this project's existing leakage-audit conventions;
      (3) CRS does not cleanly resolve to an EPSG code -- must be
      explicitly confirmed/reprojected, not assumed, before any spatial
      join with DEM/rainfall/soil layers.
    tests_run: "ml-service/tests/test_ner_subset.py (6 tests, synthetic fixtures) -- all pass. Full suite: see final response."
